name: Deploy Workflow Service to GKE

on:
  push:
    branches:
      - ga-deployments
    paths:
      - 'workflow/**'
      - '.github/workflows/deploy-workflow-service.yaml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'prod'
        type: choice
        options:
        - prod
        - staging

env:
  GCP_PROJECT_ID: gtp-apigateway-prod
  GKE_CLUSTER: default
  GKE_LOCATION: asia-southeast2
  GKE_NAMESPACE: prod
  DEPLOYMENT_NAME: workflow-n8n

jobs:
  deploy:
    runs-on: general
    permissions:
        contents: read
        id-token: write
    defaults:
      run:
        shell: bash -eo pipefail {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Exchange github oidc token
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: projects/815883525249/locations/global/workloadIdentityPools/github-action/providers/github-action
          service_account: jenkins@luminous-lodge-376415.iam.gserviceaccount.com

      - name: Connect tailscale
        run: |
            sudo tailscale status -json | jq .BackendState -r

      - name: Setup credential
        run: |
          gcloud container clusters get-credentials $GKE_CLUSTER --region $GKE_LOCATION --project $GCP_PROJECT_ID -q

      - name: Deploy to GKE
        working-directory: workflow/deployment
        run: |
          kubectl apply -k .
          kubectl rollout status deployment/$DEPLOYMENT_NAME -n $GKE_NAMESPACE --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get deployment $DEPLOYMENT_NAME -n $GKE_NAMESPACE
          kubectl get pods -l app=workflow-n8n -n $GKE_NAMESPACE
          kubectl get service workflow-n8n -n $GKE_NAMESPACE

      - name: Get service endpoints
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environment**: ${{ github.event.inputs.environment || 'prod' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Namespace**: \`$GKE_NAMESPACE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Deployment**: \`$DEPLOYMENT_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Access the application:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`bash" >> "$GITHUB_STEP_SUMMARY"
          echo "kubectl port-forward service/workflow-n8n 5678:80 -n $GKE_NAMESPACE" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Then access: http://localhost:5678" >> "$GITHUB_STEP_SUMMARY"