# Ingress for /api paths - strips /api prefix
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inaproc-api-gateway-docs
  namespace: prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: data.eproc.dev
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: inaproc-api-gateway-docs
            port:
              number: 3000

---
# Ingress for static assets - no rewriting
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inaproc-api-gateway-docs-assets
  namespace: prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  ingressClassName: nginx
  rules:
  - host: data.eproc.dev
    http:
      paths:
      - path: /_next
        pathType: Prefix
        backend:
          service:
            name: inaproc-api-gateway-docs
            port:
              number: 3000
      - path: /img
        pathType: Prefix
        backend:
          service:
            name: inaproc-api-gateway-docs
            port:
              number: 3000
      - path: /favicon.ico
        pathType: Exact
        backend:
          service:
            name: inaproc-api-gateway-docs
            port:
              number: 3000