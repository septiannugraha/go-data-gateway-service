apiVersion: apps/v1
kind: Deployment
metadata:
  name: inaproc-api-gateway-docs
  namespace: prod
  labels:
    app: inaproc-api-gateway-docs
    component: documentation
    environment: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inaproc-api-gateway-docs
  template:
    metadata:
      labels:
        app: inaproc-api-gateway-docs
        component: documentation
        environment: production
    spec:
      containers:
      - name: inaproc-api-gateway-docs
        image: asia-southeast2-docker.pkg.dev/luminous-lodge-376415/jenkins/inaproc-apigateway-docs:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: NEXT_PUBLIC_BASE_PATH
          value: "/api"
        - name: NEXT_PUBLIC_ASSET_PREFIX
          value: "/api"
        - name: NEXT_TELEMETRY_DISABLED
          value: "1"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
      restartPolicy: Always
