openapi: 3.0.0
info:
  title: Inaproc API Gateway
  description: API Gateway untuk integrasi sistem pengadaan pemerintah Indonesia
  version: 1.0.0
  contact:
    email: api-support@inaproc.id
    name: Inaproc API Support
    url: https://api.inaproc.id
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000/api/mock
    description: Local mock server (untuk testing dan demo)
  - url: https://api.inaproc.id/v1
    description: Production server
  - url: https://sandbox-api.inaproc.id/v1
    description: Sandbox server

security:
  - bearerAuth: []

tags:
  - name: Authentication
    description: Endpoint untuk autentikasi
  - name: Tender
    description: Layanan Tender dan Non Tender (bukan SPSE)
  - name: Vendor
    description: Layanan data Penyedia (bukan SIKAP)
  - name: RUP
    description: Rencana Umum Pengadaan (bukan SIRUP)

paths:
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login untuk mendapatkan access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: secretpassword
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
                    example: 3600
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "user123"
                      email:
                        type: string
                        example: "user@example.com"
                      name:
                        type: string
                        example: "John Doe"
              examples:
                success:
                  summary: Login berhasil
                  value:
                    access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
                    token_type: "Bearer"
                    expires_in: 3600
                    user:
                      id: "user123"
                      email: "user@example.com"
                      name: "John Doe"
        '400':
          description: Bad Request - Data login tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_credentials:
                  summary: Email atau password tidak valid
                  value:
                    error:
                      code: "INVALID_CREDENTIALS"
                      message: "Email atau password yang Anda masukkan tidak valid"
                      details: ["Pastikan email dan password benar"]
                missing_fields:
                  summary: Field wajib tidak lengkap
                  value:
                    error:
                      code: "MISSING_REQUIRED_FIELDS"
                      message: "Data yang diperlukan tidak lengkap"
                      details: ["Field 'email' wajib diisi", "Field 'password' wajib diisi"]
        '403':
          description: Forbidden - Akses ditolak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                account_locked:
                  summary: Akun terkunci karena terlalu banyak percobaan login gagal
                  value:
                    error:
                      code: "ACCOUNT_LOCKED"
                      message: "Akun Anda telah terkunci sementara"
                      details: ["Terlalu banyak percobaan login yang gagal", "Silakan coba lagi dalam 15 menit"]
                account_disabled:
                  summary: Akun dinonaktifkan
                  value:
                    error:
                      code: "ACCOUNT_DISABLED"
                      message: "Akun Anda telah dinonaktifkan"
                      details: ["Hubungi administrator untuk mengaktifkan kembali akun"]
        '429':
          description: Too Many Requests - Terlalu banyak permintaan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rate_limit:
                  summary: Rate limit tercapai
                  value:
                    error:
                      code: "RATE_LIMIT_EXCEEDED"
                      message: "Terlalu banyak permintaan dalam waktu singkat"
                      details: ["Maksimal 5 percobaan login per menit"]
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                server_error:
                  summary: Kesalahan server internal
                  value:
                    error:
                      code: "INTERNAL_SERVER_ERROR"
                      message: "Terjadi kesalahan pada server"
                      details: ["Silakan coba lagi beberapa saat"]

  /rup/download-file:
    post:
      tags: [RUP]
      summary: Download File RUP (Rencana Umum Pengadaan)
      description: Mengunduh file RUP dalam format Excel berdasarkan kriteria yang diberikan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - lpse_id
                - tahun
                - format
              properties:
                lpse_id:
                  type: string
                  description: ID LPSE (kode instansi/KL/PD)
                  example: "123"
                tahun:
                  type: integer
                  description: Tahun data RUP
                  minimum: 2020
                  maximum: 2030
                  example: 2024
                bulan:
                  type: integer
                  description: Bulan data (opsional, jika tidak diisi akan mengambil seluruh tahun)
                  minimum: 1
                  maximum: 12
                  example: 6
                format:
                  type: string
                  enum: ["excel", "pdf", "csv"]
                  description: Format file yang diinginkan
                  example: "excel"
                jenis_rup:
                  type: string
                  enum: ["penyedia", "swakelola", "semua"]
                  description: Jenis RUP yang akan diunduh
                  default: "semua"
                  example: "penyedia"
            examples:
              download_excel:
                summary: Download RUP format Excel
                value:
                  lpse_id: "123"
                  tahun: 2024
                  bulan: 6
                  format: "excel"
                  jenis_rup: "penyedia"
              download_csv_yearly:
                summary: Download RUP format CSV untuk seluruh tahun
                value:
                  lpse_id: "456"
                  tahun: 2024
                  format: "csv"
                  jenis_rup: "semua"
      responses:
        '200':
          description: File berhasil dibuat dan siap diunduh
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "File RUP berhasil dibuat"
                  download_url:
                    type: string
                    format: uri
                    example: "https://api.inaproc.id/v1/files/download/rup_2024_123.xlsx"
                  file_info:
                    type: object
                    properties:
                      filename:
                        type: string
                        example: "rup_penyedia_2024_123.xlsx"
                      size:
                        type: string
                        example: "2.5 MB"
                      total_records:
                        type: integer
                        example: 1250
                      created_at:
                        type: string
                        format: date-time
                        example: "2024-08-28T10:30:00Z"
                      expires_at:
                        type: string
                        format: date-time
                        example: "2024-08-28T22:30:00Z"
              examples:
                excel_success:
                  summary: File Excel berhasil dibuat
                  value:
                    status: "success"
                    message: "File RUP berhasil dibuat"
                    download_url: "https://api.inaproc.id/v1/files/download/rup_2024_123.xlsx"
                    file_info:
                      filename: "rup_penyedia_2024_123.xlsx"
                      size: "2.5 MB"
                      total_records: 1250
                      created_at: "2024-08-28T10:30:00Z"
                      expires_at: "2024-08-28T22:30:00Z"
        '400':
          description: Bad Request - Parameter tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_year:
                  summary: Tahun tidak valid
                  value:
                    error:
                      code: "INVALID_YEAR"
                      message: "Tahun yang Anda masukkan tidak valid"
                      details: ["Tahun harus antara 2020-2030"]
                missing_lpse_id:
                  summary: LPSE ID tidak diberikan
                  value:
                    error:
                      code: "MISSING_LPSE_ID"
                      message: "LPSE ID wajib diisi"
                      details: ["Parameter lpse_id tidak boleh kosong"]
                invalid_format:
                  summary: Format file tidak didukung
                  value:
                    error:
                      code: "INVALID_FORMAT"
                      message: "Format file tidak didukung"
                      details: ["Format yang didukung: excel, pdf, csv"]
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden - Tidak memiliki akses ke LPSE ini
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                no_access_to_lpse:
                  summary: Tidak memiliki akses ke LPSE
                  value:
                    error:
                      code: "NO_ACCESS_TO_LPSE"
                      message: "Anda tidak memiliki akses ke LPSE ini"
                      details: ["Hubungi administrator untuk mendapatkan akses ke LPSE 123"]
        '404':
          description: Data tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                no_data_found:
                  summary: Tidak ada data RUP
                  value:
                    error:
                      code: "NO_DATA_FOUND"
                      message: "Tidak ada data RUP untuk kriteria yang diberikan"
                      details: ["Pastikan LPSE ID, tahun, dan bulan benar"]
        '429':
          description: Too Many Requests - Terlalu banyak permintaan download
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                download_limit:
                  summary: Batas download tercapai
                  value:
                    error:
                      code: "DOWNLOAD_LIMIT_EXCEEDED"
                      message: "Batas download per hari telah tercapai"
                      details: ["Maksimal 10 file per hari per user"]
        '500':
          $ref: '#/components/responses/InternalServerError'

  # =========================
  # Vendor (Penyedia)
  # =========================
  /vendor/penyedia:
    get:
      tags: [Vendor]
      summary: Semua Penyedia
      description: Mengambil daftar seluruh penyedia. Dapat difilter dengan lpse_id, tahun, dan bulan.
      parameters:
        - $ref: '#/components/parameters/LpseIdOptional'
        - $ref: '#/components/parameters/TahunOptional'
        - $ref: '#/components/parameters/BulanOptional'
      responses:
        '200':
          description: Daftar penyedia
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: "vendor-001"
                        nama:
                          type: string
                          example: "PT. Teknologi Maju Jaya"
                        npwp:
                          type: string
                          example: "01.234.567.8-901.000"
                        alamat:
                          type: string
                          example: "Jl. Sudirman No. 123, Jakarta Selatan"
                        terverifikasi:
                          type: boolean
                          example: true
                        kualifikasi:
                          type: string
                          example: "Besar"
                        bidang_usaha:
                          type: array
                          items:
                            type: string
                          example: ["Teknologi Informasi", "Perangkat Lunak"]
                        tanggal_daftar:
                          type: string
                          format: date
                          example: "2024-01-15"
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  meta:
                    type: object
                    properties:
                      total_verified:
                        type: integer
                        example: 1250
                      total_unverified:
                        type: integer
                        example: 450
              examples:
                success:
                  summary: Daftar penyedia berhasil diambil
                  value:
                    data:
                      - id: "vendor-001"
                        nama: "PT. Teknologi Maju Jaya"
                        npwp: "01.234.567.8-901.000"
                        alamat: "Jl. Sudirman No. 123, Jakarta Selatan"
                        terverifikasi: true
                        kualifikasi: "Besar"
                        bidang_usaha: ["Teknologi Informasi", "Perangkat Lunak"]
                        tanggal_daftar: "2024-01-15"
                      - id: "vendor-002"
                        nama: "CV. Mitra Konstruksi"
                        npwp: "02.345.678.9-012.000"
                        alamat: "Jl. Gatot Subroto No. 456, Jakarta Pusat"
                        terverifikasi: false
                        kualifikasi: "Menengah"
                        bidang_usaha: ["Konstruksi", "Arsitektur"]
                        tanggal_daftar: "2024-02-20"
                    pagination:
                      current_page: 1
                      total_pages: 25
                      total_items: 1700
                      items_per_page: 100
                    meta:
                      total_verified: 1250
                      total_unverified: 450
                empty_results:
                  summary: Tidak ada data penyedia
                  value:
                    data: []
                    pagination:
                      current_page: 1
                      total_pages: 0
                      total_items: 0
                      items_per_page: 100
                    meta:
                      total_verified: 0
                      total_unverified: 0
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

