components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    UnauthorizedError:
      description: Token tidak valid atau telah kedaluwarsa
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_token:
              summary: Token tidak valid
              value:
                error:
                  code: "INVALID_TOKEN"
                  message: "Token yang Anda gunakan tidak valid"
                  details: ["Silakan login ulang untuk mendapatkan token baru"]
            expired_token:
              summary: Token kedaluwarsa
              value:
                error:
                  code: "TOKEN_EXPIRED"
                  message: "Token Anda telah kedaluwarsa"
                  details: ["Silakan login ulang untuk mendapatkan token baru"]
    
    ForbiddenError:
      description: Akses ditolak - Anda tidak memiliki izin untuk mengakses resource ini
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            insufficient_permissions:
              summary: Izin tidak mencukupi
              value:
                error:
                  code: "INSUFFICIENT_PERMISSIONS"
                  message: "Anda tidak memiliki izin untuk mengakses resource ini"
                  details: ["Hubungi administrator untuk mendapatkan akses"]
    
    NotFoundError:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            resource_not_found:
              summary: Data tidak ditemukan
              value:
                error:
                  code: "RESOURCE_NOT_FOUND"
                  message: "Data yang Anda cari tidak ditemukan"
                  details: ["Pastikan parameter yang Anda berikan benar"]
    
    BadRequestError:
      description: Permintaan tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_parameters:
              summary: Parameter tidak valid
              value:
                error:
                  code: "INVALID_PARAMETERS"
                  message: "Parameter yang Anda berikan tidak valid"
                  details: ["Periksa kembali format dan nilai parameter"]
    
    InternalServerError:
      description: Kesalahan server internal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            server_error:
              summary: Kesalahan server
              value:
                error:
                  code: "INTERNAL_SERVER_ERROR"
                  message: "Terjadi kesalahan pada server"
                  details: ["Silakan coba lagi beberapa saat"]

  parameters:
    LpseId:
      name: lpse_id
      in: query
      required: true
      schema:
        type: string
      description: ID LPSE (kode instansi/KL/PD)
    Tahun:
      name: tahun
      in: query
      required: true
      schema:
        type: integer
        minimum: 2000
      description: Tahun data
    Bulan:
      name: bulan
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 12
      description: Bulan data (1-12)
    LpseIdOptional:
      name: lpse_id
      in: query
      required: false
      schema:
        type: string
      description: ID LPSE (opsional)
    TahunOptional:
      name: tahun
      in: query
      required: false
      schema:
        type: integer
        minimum: 2000
      description: Tahun (opsional)
    BulanOptional:
      name: bulan
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 12
      description: Bulan (opsional)

  schemas:
    Tender:
      type: object
      properties:
        id:
          type: string
          example: TENDER-2024-001
        title:
          type: string
          example: Pengadaan Komputer Kantor
        agency:
          type: string
          example: Kementerian Keuangan
        budget:
          type: number
          example: 500000000
        status:
          type: string
          enum: [active, completed, cancelled]
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date

    VendorPerformance:
      type: object
      properties:
        vendor_id:
          type: string
        vendor_name:
          type: string
        overall_score:
          type: number
          minimum: 0
          maximum: 100
        total_projects:
          type: integer
        completed_projects:
          type: integer
        performance_metrics:
          type: object
          properties:
            quality:
              type: number
            timeliness:
              type: number
            compliance:
              type: number

    ProcurementPlan:
      type: object
      properties:
        id:
          type: string
        agency:
          type: string
        year:
          type: integer
        total_budget:
          type: number
        items:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              category:
                type: string
              estimated_value:
                type: number
              procurement_method:
                type: string

    Pagination:
      type: object
      properties:
        current_page:
          type: integer
        total_pages:
          type: integer
        total_items:
          type: integer
        items_per_page:
          type: integer

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: string