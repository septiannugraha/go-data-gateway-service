apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-gateway-service
  namespace: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: data-gateway-service
  template:
    metadata:
      labels:
        app: data-gateway-service
        component: data-gateway
        environment: production
    spec:
      serviceAccountName: data-gateway-service
      containers:
      - name: data-gateway-service
        image: asia-southeast2-docker.pkg.dev/luminous-lodge-376415/jenkins/data-gateway-service:latest
        ports:
        - containerPort: 8081
          name: http
        env:
        - name: PORT
          value: "8081"
        - name: ENV
          value: "production"
        - name: API_KEYS
          value: "demo-key-123,fusio-gateway-key,test-key-456"
        - name: RATE_LIMIT
          value: "100"
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: data-gateway-service-secrets
              key: REDIS_HOST
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: data-gateway-service-secrets
              key: REDIS_PASSWORD
        - name: REDIS_DB
          value: "0"
        - name: POSTGRES_HOST
          valueFrom:
            secretKeyRef:
              name: data-gateway-service-secrets
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            secretKeyRef:
              name: data-gateway-service-secrets
              key: POSTGRES_PORT
        - name: POSTGRES_DATABASE
          valueFrom:
            secretKeyRef:
              name: data-gateway-service-secrets
              key: POSTGRES_DATABASE
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: data-gateway-service-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: data-gateway-service-secrets
              key: POSTGRES_PASSWORD
        - name: DREMIO_HOST
          valueFrom:
            secretKeyRef:
              name: data-gateway-service-secrets
              key: DREMIO_HOST
        - name: DREMIO_PORT
          value: "32010"
        - name: DREMIO_USERNAME
          valueFrom:
            secretKeyRef:
              name: data-gateway-service-secrets
              key: DREMIO_USERNAME
        - name: DREMIO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: data-gateway-service-secrets
              key: DREMIO_PASSWORD
        - name: BIGQUERY_PROJECT_ID
          valueFrom:
            secretKeyRef:
              name: data-gateway-service-secrets
              key: BIGQUERY_PROJECT_ID
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: "/var/secrets/google/credentials.json"
        volumeMounts:
        - name: google-credentials
          mountPath: /var/secrets/google
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
      volumes:
      - name: google-credentials
        secret:
          secretName: data-gateway-service-secrets
          items:
          - key: GOOGLE_APPLICATION_CREDENTIALS
            path: credentials.json