apiVersion: apps/v1
kind: Deployment
metadata:
  name: inaproc-api-gateway
  namespace: prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: inaproc-api-gateway
  template:
    metadata:
      labels:
        app: inaproc-api-gateway
        component: api-gateway
        environment: production
    spec:
      containers:
      - name: inaproc-api-gateway
        image: asia-southeast2-docker.pkg.dev/luminous-lodge-376415/jenkins/inaproc-api-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        env:
        - name: APP_ENV
          value: "prod"
        - name: APP_DEBUG
          value: "false"
        - name: APP_PROJECT_KEY
          value: "cee262a5a1bdd205cbfe0dfc2ad4eddf"
        - name: APP_CONNECTION
          valueFrom:
            secretKeyRef:
              name: gateway-postgres-uri
              key: GATEWAY_POSTGRES_URI
        - name: APP_MAILER
          value: "native://default"
        - name: APP_MESSENGER
          value: "doctrine://default"
        - name: APP_URL
          value: "https://data.eproc.dev"
        - name: APP_APPS_URL
          value: "https://data.eproc.dev/apps"
        - name: FUSIO_URL
          value: "https://data.eproc.dev"
        - name: FUSIO_APPS_URL
          value: "https://data.eproc.dev/apps"
        - name: FUSIO_BACKEND_USER
          value: "admin"
        - name: FUSIO_BACKEND_EMAIL
          value: "admin@fusio-project.org"
        - name: FUSIO_BACKEND_PW
          value: "secure-admin-password"
        resources:
          requests:
            memory: "512Mi"
            cpu: "300m"
          limits:
            memory: "1Gi"
            cpu: "800m"
        livenessProbe:
          httpGet:
            path: /apps/account
            port: 80
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 10
        readinessProbe:
          httpGet:
            path: /apps/account
            port: 80
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 10